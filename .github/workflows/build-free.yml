name: Build RestlessOS GSI (Free Runner)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (e.g., treble_arm64_bvN-userdebug)'
        required: true
        default: 'treble_arm64_bvN-userdebug'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 16384
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=$PATH:$HOME/bin" >> $GITHUB_ENV

      - name: Sync Source
        run: |
          # Use shallow clone to save space
          repo init -u https://github.com/RestlessOS/manifest.git -b android-16.0 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Apply Patches
        run: |
          bash patches/apply.sh trebledroid
          bash patches/apply.sh trebledroid-staging
          bash patches/apply.sh rom
          bash patches/apply.sh personal

      - name: Build GSI
        run: |
          source build/envsetup.sh
          lunch ${{ github.event.inputs.build_target }}
          make -j$(nproc) systemimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restlessos-gsi
          path: out/target/product/*/system.img
